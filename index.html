<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوة عقيقة ليل</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5ebe5;color:#65494b;font-family:Tahoma,Arial,sans-serif}
.cover{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cover-image{width:100%;height:100%;max-width:520px;object-fit:cover}
.open-btn{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:72%;max-width:330px;padding:17px;border:0;border-radius:50px;background:#a9787d;color:#fff;font-size:21px;font-weight:bold;box-shadow:0 8px 22px #50323f40;cursor:pointer}
.invitation{display:none;max-width:520px;margin:auto;padding:45px 20px 55px;text-align:center;background:linear-gradient(#fffaf7,#f7ebe6);min-height:100vh}
.invitation.show{display:block;animation:fade .7s ease}@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ornament{font-size:26px;margin-bottom:8px}h1{margin:0;font-size:38px;color:#8b6267}.subtitle{margin:8px 0 30px;font-size:18px}
.box{background:#ffffffd1;border-radius:22px;padding:20px 18px;margin:14px 0;box-shadow:0 6px 20px #5a3c3714}
.label{font-size:13px;color:#9a7c7e;margin-bottom:7px}.value{font-size:20px;line-height:1.7;font-weight:bold}.quran{line-height:2.15;font-size:17px}
.welcome{margin:28px 0 18px;font-size:20px;font-weight:bold;color:#8b6267}.back-btn{margin-top:20px;border:1px solid #c6a5a7;background:transparent;color:#8b6267;border-radius:30px;padding:11px 24px;font-size:15px}
.countdown{display:flex;justify-content:center;gap:10px;margin-top:6px}
.count-item{background:#fdf3f0;border-radius:14px;padding:10px 8px;min-width:62px;box-shadow:0 3px 10px #5a3c3712}
.count-num{font-size:24px;font-weight:bold;color:#8b6267;line-height:1.1}
.count-label{font-size:11px;color:#9a7c7e;margin-top:3px}
</style>
</head>
<body>
<section class="cover" id="cover">
<img class="cover-image" src="invitation.png" alt="دعوة عقيقة ليل">
<button class="open-btn" onclick="openInvitation()">افتح الدعوة</button>
</section>
<main class="invitation" id="invitation">

<h1>ليل 🤍</h1><div class="subtitle">دعوة عقيقة</div>
<div class="welcome">بسم الله ما شاء الله، فرحتنا بعقيقتنا تكتمل بوجودكم 🤍</div>
